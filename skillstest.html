<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>2Q Skills Test</title>

<style>
 body { 
        font-family: Verdana, Geneva, Tahoma, sans-serif; 
        background: url(https://i.pinimg.com/1200x/5b/96/31/5b9631e0e949bb2fdef354f0ddd38fb0.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        margin: 0;
        padding: 0;
    }

ul {
    list-style-type: none; 
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #ffffff;
    width: 100%;
    box-sizing: border-box;
}

ul li {
    float: left;
}

ul li a:hover {
    background-color: rgb(255, 244, 246);
    padding: 15px 30px; 
}

ul li a {
    display: block;
    color: rgb(223, 120, 154);
    text-align: center;
    padding: 17px 19px;
    text-decoration: none;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

#firstbox {
    background-color: rgb(255, 254, 254);
    width: 600px;
    height: auto;
    margin-left: auto;
    margin-right: auto;
    margin-top: 90px;
    border-radius: 15px;
    text-align: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
}

input {
    width: 400px;
    height: 50px;
    border-radius: 20px;
    outline: none;
    border: none;
    text-align: left;
    padding-left: 20px;
    box-sizing: border-box;
    color: #EA9DB7;
    font-size: 15px;
    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px; 
}

input::placeholder {
    color: #EFB6C9;
    font-style: italic;
}

button {
    width: 200px;
    height: 50px;
    color: rgb(255, 255, 255);
    border: none;
    font-size: 20px;
    background-color: #EA9DB7;
    outline: none;
    border-radius: 15px;
    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
}
</style>
</head>

<body>

<ul>
  <li><a href="index.html"><b>Club Member Checker</b></a></li>
  <li><a href="skillstest.html"><b>Element Checker</b></a></li>
  <li><a href="drill2.html"><b>School Club Members</b></a></li>
  <li><a href="project.html"><b>Meet the Creator</b></a></li>
</ul>

<div id="firstbox">
    <h1 style="padding-top: 30px; color: #EA9DB7; font-size: 30px;"><b>Nonmetal Elements</b></h1>
    <p style="color: rgb(180, 180, 180);"><i>Enter a nonmetal's <b>SYMBOL</b> and find out more about it!</i></p>
    <input type="text" id="nonmetal" placeholder="Example: H" style="margin-top: 2px;">
    <br><br>
    <button type="button" py-click="search_nm"><b>Search Nonmetal</b></button>
    <br><br>
        <div class="result" id="result3" style="display: none;">
        <h3 style="color:#EA9DB7;"><b>Search Result</b></h3>
        <p style="color: #EFB6C9;"><b>Symbol:</b> <span id="symbol"></span></p>
        <p style="color: #EFB6C9;"><b>Name:</b> <span id="name"></span></p>
        <p style="color: #EFB6C9;"><b>Atomic Number:</b> <span id="number"></span></p>
        <p style="color: #EFB6C9;"><b>Atomic Mass:</b> <span id="mass"></span></p>
    </div>
    <br>
</div>

<script type="py" src="main.py"></script>

</body>
</html>
