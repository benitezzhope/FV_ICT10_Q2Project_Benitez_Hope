<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Drill #2</title>
    <style>
        /* CSS Design */
        ul {
            list-style-type: none; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            width: 100%;
            box-sizing: border-box;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(223, 120, 154);
            text-align: center;
            padding: 17px 19px;
            text-decoration: none;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        ul li a:hover {
            background-color: rgb(255, 244, 246);
            padding: 15px 30px; 
        }

        body { 
            font-family: Verdana, Geneva, Tahoma, sans-serif; 
            background: url(https://i.pinimg.com/1200x/5b/96/31/5b9631e0e949bb2fdef354f0ddd38fb0.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
            padding: 0;
        }

        .box-container {
            display: flex;
            justify-content: center; 
            align-items: center;
            gap: 30px; 
            margin-top: 30px;
            flex-wrap: wrap;
        }

        #firstbox, #secondbox {
            margin-top: 120px;
            background-color: rgb(255, 255, 255);
            width: 600px;
            height: 400px;
            border-radius: 15px;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            box-shadow: rgba(234, 157, 183, 0.4) 5px 5px, rgba(234, 157, 183, 0.3) 10px 10px, rgba(234, 157, 183, 0.2) 15px 15px, rgba(234, 157, 183, 0.1) 20px 20px, rgba(234, 157, 183, 0.05) 25px 25px; /* From CSS Scan */
            box-sizing: border-box;
        }

        #secondbox {
            display: none;
            padding-top: 15px;
        }

        input {
            width: 400px;
            height: 50px;
            border-radius: 20px;
            outline: none;
            border: none;
            text-align: left;
            padding-left: 20px;
            box-sizing: border-box;
            color: #EA9DB7;
            font-size: 15px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px; 
        }
        
        input::placeholder {
    color: #EFB6C9;
    font-style: italic;
        }

        button {
            width: 150px;
            height: 50px;
            color: rgb(255, 255, 255);
            border: none;
            font-size: 20px;
            background-color: #EA9DB7;
            outline: none;
            border-radius: 15px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="index.html"><b>Club Member Checker</b></a></li>
        <li><a href="skillstest.html"><b>Element Checker</b></a></li>
        <li><a href="drill2.html"><b>School Club Members</b></a></li>
        <li><a href="project.html"><b>Meet the Creator</b></a></li>
    </ul>

    <div class="box-container">
        <div id="firstbox">
            <p style="color: #e4adc0; text-align: center; padding-top: 30px;"><i>Join <b>CommArts</b> Now!</i></p>
            <h1 style="color: #EA9DB7; text-align: center">Add New Member</h1>
            
            <!--Input Fields-->
            <input type="text" id="firstname" name="firstname" placeholder="Enter first name..." style="padding-top: 2px;">
            <br><br>
            <input type="text" id="lastname" name="lastname" placeholder="Enter last name...">
            <br><br><br>
            <button type="button" py-click="check"><b>Add Name</b></button>
        </div>

        <div id="secondbox">
            <p id="result2" style="color: #EA9DB7; font-family: Verdana, Geneva, Tahoma, sans-serif; text-align: left; margin-left: 30px;"></p>
        </div>
    </div>
    <script type="py" src="main.py"></script>

</body>
</html>
